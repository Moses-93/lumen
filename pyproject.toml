[project]
name = "lumen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "dishka>=1.10.1",
    "ollama>=0.6.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "typer>=0.24.2",
]

[project.optional-dependencies]
cpu = [
    "fastembed>=0.8.0",
]
gpu = [
    "fastembed-gpu>=0.8.0",
]

[project.scripts]
lumen = "lumen.bootstrap.setup.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
